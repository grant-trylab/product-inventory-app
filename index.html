<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457c5">
  <title>產品庫存查詢</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .search-box{position:relative}
    .suggestion-list{position:absolute;z-index:10;top:100%;left:0;right:0;max-height:18rem;overflow-y:auto;background:#fff;border:1px solid #cbd5e1;border-radius:0 0 10px 10px;box-shadow:0 8px 18px #1720331a}
    .suggestion-option{display:block;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #e5e7eb;background:#fff;color:#172033;text-align:left;font:inherit;cursor:pointer}
    .suggestion-option:hover,.suggestion-option:focus{background:#edf3ff;outline:2px solid #2457c5;outline-offset:-2px}
  </style>
</head>
<body>
  <main class="app">
    <header><h1>產品庫存查詢</h1></header>

    <section id="auth-panel" class="panel">
      <h2>登入共用資料庫</h2>
      <p class="hint">請使用已由管理者建立的帳號登入。</p>
      <form id="login-form">
        <label for="email">電子郵件</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">登入</button>
      </form>
      <p id="login-error" class="status error hidden" role="alert" aria-live="assertive"></p>
    </section>

    <section id="inventory-panel" class="hidden">
      <div class="account-bar"><span id="signed-in-as"></span><button id="logout-button" class="secondary" type="button">登出</button></div>
      <form id="search-form" class="panel">
        <label for="search-name">輸入產品名</label>
        <div class="search-box">
          <div class="search-row"><input id="search-name" type="search" placeholder="輸入部分產品名稱" autocomplete="off" aria-autocomplete="list" aria-controls="product-suggestions" required><button type="submit">查詢</button></div>
          <div id="product-suggestions" class="suggestion-list hidden" role="listbox" aria-label="相符產品"></div>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">登入後即可查詢共用資料。</p>
      <section id="result" class="panel hidden" aria-live="polite">
        <h2 id="product-title"></h2>
        <dl><div><dt>代碼</dt><dd id="product-code"></dd></div><div><dt>庫存位置</dt><dd id="product-location"></dd></div></dl>
        <button id="edit-button" class="secondary" type="button">變更</button>
      </section>
      <section id="not-found" class="panel hidden">
        <h2>無產品</h2><p>找不到相符產品。是否新增此產品？</p>
        <div class="actions"><button id="yes-add" type="button">是，新增</button><button id="no-add" class="secondary" type="button">否，返回首頁</button></div>
      </section>
      <form id="product-form" class="panel hidden">
        <h2 id="form-title">新增產品</h2>
        <label for="form-name">產品名</label><input id="form-name" required>
        <label for="form-code">代碼</label><input id="form-code" required>
        <label for="form-location">庫存位置</label><input id="form-location" required>
        <div class="actions"><button type="submit">儲存</button><button id="cancel-form" class="secondary" type="button">取消</button></div>
      </form>
    </section>
    <footer>已登入後的資料會儲存在 Supabase，授權使用者可跨裝置共用。</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
